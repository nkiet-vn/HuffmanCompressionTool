name: CLI and Type Foundry GUI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - name: Configure
        run: cmake -S . -B build -DHUFFMAN_BUILD_GUI=ON -DHUFFMAN_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Compile
        run: cmake --build build --config Release --parallel 4
      - name: Verify C++ tests and original CLI
        run: ctest --test-dir build --output-on-failure -C Release
      - name: Verify GUI executable was produced
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            test -f build/gui/Release/huffman_gui.exe || test -f build/gui/huffman_gui.exe
          elif [ "$RUNNER_OS" = macOS ]; then
            find build -name 'huffman_gui.app' -type d | grep -q .
          else
            test -x build/gui/huffman_gui
          fi
