name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Kiểm tra tên file trong include có đúng hoa thường (Linux phân biệt hoa thường).
      - name: Check file name case (Linux)
        if: runner.os == 'Linux'
        run: |
          mapfile -t headers < <(
            grep -rhoE '#include[[:space:]]+"[^"]+"' src include tests |
              sed -E 's/.*"([^"]+)".*/\1/' | sort -u
          )
          for h in "${headers[@]}"; do
            if [ ! -f "include/$h" ] && [ ! -f "src/$h" ] && [ ! -f "tests/$h" ]; then
              echo "::error::Không tìm thấy header '$h' với đúng hoa thường"; exit 1
            fi
          done

      - name: Configure (Debug)
        run: cmake -S . -B build-debug -DCMAKE_BUILD_TYPE=Debug

      - name: Build (Debug)
        run: cmake --build build-debug --config Debug

      - name: Test (Debug)
        run: ctest --test-dir build-debug -C Debug --output-on-failure

      - name: Configure (Release)
        run: cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release

      - name: Build (Release)
        run: cmake --build build-release --config Release

      - name: Test (Release)
        run: ctest --test-dir build-release -C Release --output-on-failure

      - name: CLI smoke test (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p build-release/smoke
          sample="file_mau_txt/mau_giainen.txt"
          archive="$PWD/build-release/smoke/sample.huf"
          restored="$PWD/build-release/smoke/restored.txt"
          ./build-release/huffman -c "$sample" "$archive"
          ./build-release/huffman -d "$archive" "$restored"
          cmp "$sample" "$restored"

      - name: CLI smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem build-release -Filter huffman.exe -Recurse |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { throw 'Could not find the Release huffman.exe' }
          $sample = (Resolve-Path file_mau_txt\mau_giainen.txt).Path
          $smokeDir = Join-Path (Resolve-Path build-release).Path smoke
          New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null
          $archive = Join-Path $smokeDir sample.huf
          $restored = Join-Path $smokeDir restored.txt
          & $exe -c $sample $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe -d $archive $restored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & fc.exe /b $sample $restored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
